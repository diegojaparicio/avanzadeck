<!-- ── SLIDE 6: LEGAL ── -->
<div class="slide">
  <div class="hdr">

      <img class="hdr-logo" src="" alt="Apex">
    </div>

  <div class="body">
    <div class="legal-statement">
      Avanza opera como empresa comercial que presta capital propio — no capta depósitos del público. Eso la excluye de la regulación bancaria (SUDEBAN) y no requiere licencia financiera de ningún tipo.
    </div>
    <div class="legal-grid">
      <div class="legal-col no-col">
        <div class="legal-col-h">Lo que no necesitamos</div>
        <div class="legal-row"><span class="legal-sym">—</span><span>Licencia bancaria de SUDEBAN</span></div>
        <div class="legal-row"><span class="legal-sym">—</span><span>Autorización como institución financiera</span></div>
        <div class="legal-row"><span class="legal-sym">—</span><span>Registro como Arrendadora Financiera</span></div>
        <div class="legal-row"><span class="legal-sym">—</span><span>Capital mínimo regulatorio bancario</span></div>
        <div class="legal-row"><span class="legal-sym">—</span><span>Aprobación del BCV</span></div>
      </div>
      <div class="legal-col yes-col">
        <div class="legal-col-h">Marco legal que nos rige</div>
        <div class="legal-row"><span class="legal-sym">↗</span><span>Ley sobre Ventas con Reserva de Dominio (1959)</span></div>
        <div class="legal-row"><span class="legal-sym">↗</span><span>Código de Comercio de Venezuela</span></div>
        <div class="legal-row"><span class="legal-sym">↗</span><span>Ley de Transporte Terrestre (INTT)</span></div>
        <div class="legal-row"><span class="legal-sym">↗</span><span>Ley Orgánica contra la Delincuencia Organizada (LOCDOFT)</span></div>
        <div class="legal-row"><span class="legal-sym">↗</span><span>Código Civil — incumplimiento contractual</span></div>
      </div>
      <div class="legal-col do-col">
        <div class="legal-col-h">Lo que sí tramitamos</div>
        <div class="legal-row"><span class="legal-sym">→</span><span>C.A. registrada en Registro Mercantil</span></div>
        <div class="legal-row"><span class="legal-sym">→</span><span>RIF ante SENIAT</span></div>
        <div class="legal-row"><span class="legal-sym">→</span><span>Licencia Municipal (Alcaldía)</span></div>
        <div class="legal-row"><span class="legal-sym">→</span><span>Registro RUSO ante ONCDOFT (antilavado)</span></div>
        <div class="legal-row"><span class="legal-sym">→</span><span>Sistema de facturación homologado SENIAT</span></div>
      </div>
    </div>
    <div class="legal-foot">Costo total de estructura inicial: &lt; $10,000 · Primera operación estimada: 6–8 semanas desde la constitución</div>
  </div>
</div>
